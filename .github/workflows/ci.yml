name: CI

"on":
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (build + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --retry=1

  backend:
    name: backend (pytest — unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # Lean deps: everything backend.app imports, minus the heavy ML stack
      # (tensorflow / xgboost / pyarrow). Tests that need MongoDB, trained
      # models or those libraries skip themselves — see backend/tests/.
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors python-dotenv pymongo clerk-backend-api \
                      numpy pandas scikit-learn scipy shapely pytest
      - name: Run unit tests
        env:
          # Real Clerk test-instance secret key, set in repo secrets - needed
          # to mint real session tokens for auth_headers (conftest.py). Falls
          # back to a placeholder (non-empty, so the app still boots) when
          # the secret isn't available, e.g. a fork PR - auth-dependent tests
          # then skip gracefully (conftest.py) instead of erroring the run.
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_ci-placeholder-not-real' }}
          MONGO_URI: mongodb://127.0.0.1:1   # unreachable -> DB tests skip
          MONGO_DB: smart_aqi_ci
        run: pytest backend/tests -q
